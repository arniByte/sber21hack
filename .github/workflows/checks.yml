name: Проверки

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m kontur demo --output results/ci
      - run: node --check web/app.js
      - uses: actions/upload-artifact@v4
        with:
          name: kontur-demo
          path: |
            results/ci/dashboard.html
            results/ci/report.json
            results/ci/simulated-trades.csv
