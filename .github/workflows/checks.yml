name: Проверки

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m kontur demo --output results/ci
      - run: node --check web/dist/app.js
      - run: node --check web/charts.js
      - uses: actions/upload-artifact@v4
        with:
          name: kontur-demo
          path: |
            results/ci/dashboard.html
            results/ci/report.json
            results/ci/simulated-trades.csv


  market:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements.txt
      - run: python scripts/prepare_market.py
      - name: Проверить три профиля на четырёх горизонтах
        run: |
          for profile in baseline contest payoff; do
            python -m kontur run --dataset archive --bars data/market-bars.csv \
              --market-snapshot data/market-snapshot.csv --profile "$profile" \
              --horizons --output "results/$profile"
          done
      - name: Проверить многодневные варианты на архиве с 2015 года
        run: |
          python scripts/prepare_market.py --start 2015-01-01
          python -m kontur run --dataset archive --bars data/market-bars.csv \
            --market-snapshot data/market-snapshot.csv --profile contest \
            --horizons --study --output results/decade
          python -m kontur research --report results/decade/decade-study.json --output results/decade/research.json
      - uses: actions/upload-artifact@v4
        with:
          name: kontur-market
          path: |
            results/*/dashboard.html
            results/*/preset.json
            results/*/report.json
            results/*/simulated-trades.csv
            results/decade/decade-study.json
            results/decade/study-trades.csv
            results/decade/research.json
